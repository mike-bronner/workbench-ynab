name: Release

# One-button release (issue #74, design M5-5): validates the version, proves
# the vendored YNAB MCP bundle is intact and boots offline, bumps the plugin
# version, runs the full test suite, commits to main, tags, and creates a
# GitHub release. Triggered manually from the Actions tab — pass the new
# version (e.g. "1.0.0") and a one-line description.
#
# Ported from workbench-bujo's release.yml, adapted for this repo's
# vendored-bundle layout: there is NO wheel build here. The vendored bundle
# (vendor/ynab-mcp/index.cjs) is committed and FROZEN — this workflow never
# re-fetches or rebuilds it; it only VERIFIES the bundle still matches the
# SHA-256 recorded in vendored.json (issue #72) before anything is written.
#
# Version model (issue #75, README "Versioning"): the release workflow's SOLE
# bump target is .claude-plugin/plugin.json. The vendored bundle's version
# marker (vendor/ynab-mcp/vendored.json) is frozen, provenance-only, and is
# never touched by release automation.
#
# After this workflow completes, `update-marketplace-sha.yml` pins the new
# commit SHA in the claude-workbench marketplace. Releases created with
# GITHUB_TOKEN emit sterile events that do NOT auto-trigger `on: release`
# workflows (GitHub anti-recursion rule), so the last step chains it
# explicitly via `gh workflow run`.
#
# Idempotency: re-running with a version that already exists fails on the
# tag-exists guard, and the monotonicity guard rejects any version that is
# not strictly greater than the current plugin.json version. Versions go
# forward only. Because those guards make a same-version re-run impossible,
# main and the tag are pushed in a SINGLE atomic push (issue #203) — a
# partial push would strand the release with no automated way back.
#
# Job split (issue #252): the `assets/` integration suite runs third-party
# install scripts and module top-level code, so it lives in its own job
# (`assets-tests`) scoped to `permissions: contents: read` — never on the
# runner that mints this workflow's `contents: write` + `actions: write`
# token. Co-residency, not credential-on-disk, is the exposure the split
# closes: same VM and same UID means untrusted code can detach a background
# process that outlives its step and scrape the token out of the push
# process's /proc/<pid>/{cmdline,environ}, which no amount of scrubbing,
# `env:`-passing, or `persist-credentials: false` in a shared job can prevent.
# `release` gates on it via `needs:`, which strengthens the old
# step-ordering guarantee into a separate-VM one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.0.0) — no `v` prefix"
        required: true
        type: string
      description:
        description: "Commit + release headline (e.g. 'tax-aware review + write-back gate')"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The untrusted-code job (issue #252). `npm --prefix assets ci` executes
  # third-party install scripts, and `npm --prefix assets test` executes their
  # module top-level code — so this job is scoped to `permissions: contents:
  # read`, overriding the workflow-level `contents: write` + `actions: write`.
  # No write-scoped token is ever minted on this runner, which is the only way
  # to close the co-residency vector: Actions does not reap detached children
  # at step boundaries, so a dep that backgrounds a process on a shared VM can
  # poll `ps` / /proc for a push credential in another step's argv OR env.
  # Mirrors ci.yml's `assets-tests` job; `release` gates on it via `needs:`.
  assets-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Publish the exact commit this suite tested. Two jobs mean two checkouts
    # of a moving `main`, so the release job re-checks this against its own
    # HEAD — otherwise the split would quietly allow a release whose assets/
    # suite ran against a different tree.
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    steps:
      # ref: main matches the release job's checkout — this suite must gate the
      # exact tree being released, not whatever ref the dispatch came from.
      # persist-credentials: false leaves not even the read-only token on disk
      # beside the third-party install; nothing in this job speaks to git.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Record the tested commit
        id: tested
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run the assets integration suite
        run: |
          set -euo pipefail
          npm --prefix assets ci
          npm --prefix assets test

  release:
    runs-on: ubuntu-latest
    # The assets suite must be green before any write happens. As a job
    # dependency this is strictly stronger than the step ordering it replaces:
    # the untrusted install cannot run late, cannot run concurrently, and
    # cannot run on this runner at all.
    needs: assets-tests
    steps:
      # persist-credentials: false is a supply-chain guard (issue #203), not a
      # style choice. By default checkout writes the job's GITHUB_TOKEN —
      # carrying this workflow's `contents: write` + `actions: write` — into
      # .git/config as an http.extraheader, where it stays for the whole job.
      # The untrusted `assets/` install has since moved off this runner
      # entirely (issue #252), so this is now defence in depth rather than the
      # sole barrier: the credential is on disk for no longer than it must be,
      # and the release push authenticates explicitly instead, at push time.
      # Local git (rev-parse, tag, commit) needs no credential.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      # The job split (issue #252) buys isolation at the cost of a second
      # checkout of a moving ref: `main` can advance between the assets-tests
      # job's checkout and this one, which would release a tree the assets/
      # suite never saw. Re-checking the SHA restores the single-checkout
      # guarantee. An empty TESTED_SHA (output dropped, job rewired) fails the
      # same way — a gate that cannot read its input has not passed.
      - name: Assert main has not moved since the assets suite ran
        env:
          TESTED_SHA: ${{ needs.assets-tests.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$TESTED_SHA" ] || [ "$TESTED_SHA" != "$HEAD_SHA" ]; then
            echo "::error::main is $HEAD_SHA but the assets/ suite tested '$TESTED_SHA' — the tree being released was never covered by that suite. Re-run the release."
            exit 1
          fi

      # Guard rails first — both checks run BEFORE any write occurs.
      - name: Validate version
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be SemVer X.Y.Z, got: $NEW_VERSION"
            exit 1
          fi
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW_VERSION already exists — versions go forward only"
            exit 1
          fi
          CURRENT=$(jq -r '.version' .claude-plugin/plugin.json)
          # "Versions go forward only" (header + docs/ci.md), enforced: the
          # tag-exists guard above only rejects already-TAGGED versions —
          # without this compare, a lower never-tagged version (current
          # 2.3.0, dispatch 1.0.0) would downgrade plugin.json, tag it, and
          # pin the marketplace to the regression. sort -V picks the max;
          # the new version must be it, and strictly newer than current.
          if [ "$NEW_VERSION" = "$CURRENT" ] || [ "$(printf '%s\n%s\n' "$CURRENT" "$NEW_VERSION" | sort -V | tail -1)" != "$NEW_VERSION" ]; then
            echo "::error::Versions go forward only — current version is $CURRENT, got: $NEW_VERSION"
            exit 1
          fi
          echo "Current: $CURRENT → New: $NEW_VERSION"

      # System node only — deliberately NO npm install, so no node_modules
      # lands on the resolution path and the offline-boot proof below stays
      # faithful (the bundle must be self-contained with NONE present).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Bundle integrity gate (issues #72 + #78): the committed bundle's
      # SHA-256 must match vendored.json AND the bundle must boot offline from
      # a node_modules-free sandbox. tests/lib/bundle-integrity.sh is the
      # single source of truth for both assertions; a mismatch fails the
      # release here, before any commit or tag exists.
      #
      # Shell flags: Actions runs every `run:` under `bash -e {0}`, so `-e` is
      # already active and `set` can only ADD flags — `set -euo pipefail` here
      # states that accurately (it is not the `-e`-less step an earlier comment
      # claimed). A failed `source` therefore aborts on `-e`; the guard below
      # is what converts a drifted-bundle return — non-zero, but `-e`-exempt
      # because it is an `if !` condition — into a polished ::error:: abort.
      - name: Verify vendored bundle integrity (checksum + offline boot)
        run: |
          set -euo pipefail
          source tests/lib/bundle-integrity.sh
          if ! bi_assert_integrity "$PWD"; then
            echo "::error::Vendored bundle integrity check failed — the committed bundle has drifted from vendored.json or no longer boots offline. Re-vendor deliberately via bin/revendor.sh; never hand-edit the bundle."
            exit 1
          fi

      # Sole bump target: .claude-plugin/plugin.json (issue #75). The vendored
      # bundle version marker (vendor/ynab-mcp/vendored.json) is frozen
      # provenance and is intentionally NOT bumped.
      - name: Bump version
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$NEW_VERSION" '.version = $v' .claude-plugin/plugin.json > tmp.json
          mv tmp.json .claude-plugin/plugin.json
          echo "Bumped .claude-plugin/plugin.json to $(jq -r '.version' .claude-plugin/plugin.json)"

      # scripts/test.sh is the single suite entrypoint — it discovers the raw
      # bash suite and the Node suite, including the offline-boot proof
      # (tests/integration/offline-boot.test.sh, issue #78). Runs with NO
      # node_modules present, matching test.yml's dependency-free job.
      #
      # The assets/ integration suite is NOT run here: it needs its own deps
      # (ajv, ajv-formats), and installing them would both pollute the
      # offline-boot proof's resolution path and put untrusted code on the
      # runner that holds the push credential. It runs in the `assets-tests`
      # job instead (issue #252), which `needs:` gates ahead of this one — so
      # "no node_modules while the offline-boot proof runs" is now a
      # separate-VM guarantee rather than a step-ordering one.
      - name: Run the test suite
        run: bash scripts/test.sh

      - name: Commit, tag, push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
          DESC: ${{ inputs.description }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .claude-plugin/plugin.json

          if git diff --cached --quiet; then
            echo "::error::No changes staged — version bump must have been a no-op"
            exit 1
          fi

          git commit -m "chore: 🔖 Release v${NEW_VERSION} — ${DESC}"
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION} — ${DESC}"

          # ONE atomic push for both refs (issue #203). Two sequential pushes
          # are not atomic: if the tag push failed after main was already
          # bumped, the release would be stranded half-done — and a re-run at
          # the same version is then rejected by the monotonicity guard above
          # ($NEW_VERSION = $CURRENT), so there is no automated way to backfill
          # the missing tag. --atomic makes the server apply both ref updates
          # in a single transaction: either main and v$NEW_VERSION both land,
          # or neither does and a plain re-run is a clean retry.
          #
          # The credential is supplied here, in the URL, rather than persisted
          # in .git/config by checkout — see the checkout step. No untrusted
          # assets/ dependency ever runs on this runner (issue #252): the
          # `assets-tests` job installed and ran them on a separate VM, which
          # `needs:` already gated green before this job started.
          git push --atomic \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/main:refs/heads/main" \
            "refs/tags/v${NEW_VERSION}:refs/tags/v${NEW_VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
          DESC: ${{ inputs.description }}
        run: |
          set -euo pipefail
          # -Fx: fixed-string, whole-line — an unanchored grep would also
          # exclude e.g. v1.2.30 when releasing v1.2.3.
          PREV_TAG=$(git tag --sort=-version:refname | grep -vFx "v${NEW_VERSION}" | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMPARE="**Diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...v${NEW_VERSION}"
          else
            COMPARE=""
          fi

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION} — ${DESC}" \
            --notes "## What changed

          ${DESC}

          ${COMPARE}

          ## Vendored bundle

          The YNAB MCP bundle (\`vendor/ynab-mcp/index.cjs\`) is frozen at the version recorded in \`vendor/ynab-mcp/vendored.json\` and verified against its committed SHA-256 before this release was tagged. Releases never rebuild or re-fetch it.

          ## Auto-pin

          \`update-marketplace-sha.yml\` will pin v${NEW_VERSION}'s commit SHA in the workbench marketplace."

      # Releases created with GITHUB_TOKEN emit sterile events — they do NOT
      # trigger the on-release marketplace pin (GitHub anti-recursion rule).
      # Chain it explicitly; API-dispatched workflow_dispatch is exempt.
      - name: Trigger marketplace SHA pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          gh workflow run update-marketplace-sha.yml \
            -R "${GITHUB_REPOSITORY}" -f tag="v${NEW_VERSION}"
