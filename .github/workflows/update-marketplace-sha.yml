name: Update marketplace SHA

# Pins this plugin's commit SHA in the claude-workbench marketplace's
# .claude-plugin/marketplace.json, so every release becomes reproducibly
# installable by SHA rather than floating on the default branch.
#
# CROSS-REPO WRITE: this workflow pushes to mike-bronner/claude-workbench.
# That marketplace is SHARED with every other workbench plugin repo, and the
# `concurrency` group below only serializes runs within this one — so the push
# rebases onto the marketplace tip and retries, bounded, when a sibling repo's
# pin lands first (issue #203).
#
# Runs automatically on every published release. Also supports manual
# backfill via workflow_dispatch (pass a tag to pin that release's SHA;
# omit to use the latest release).
#
# Credential handling (issue #252): the marketplace is cloned WITHOUT
# credentials, so the long-lived PAT is never persisted into
# marketplace/.git/config; it is supplied only in the push URL, at push time.
# Same posture release.yml uses for its own push.
#
# Prerequisites (documented in docs/ci.md):
# - Secret `DEVELOPER_SETTINGS_TOKEN` set at the repo or org level.
#   Fine-grained PAT with Contents: Read and write on
#   mike-bronner/claude-workbench (sufficient to push the pin commit).
#
# Portability: this workflow reads the plugin's own name from
# .claude-plugin/plugin.json, so it drops into any workbench plugin repo
# unchanged.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to pin (defaults to latest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-marketplace-sha
  cancel-in-progress: false

jobs:
  pin-sha:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      # Every dynamic value threads through env: — never spliced into the
      # script with ${{ }}, which is substituted BEFORE bash parses the text
      # and would let a crafted tag name (release event or dispatch input)
      # run arbitrary shell on a runner that later holds the cross-repo PAT.
      - name: Resolve plugin name + tag SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          echo "plugin_name=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo "$REPO" --json tagName --jq '.tagName')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Resolve tag ref → commit SHA, dereferencing annotated tags.
          REF=$(gh api "repos/$REPO/git/refs/tags/$TAG")
          OBJECT_TYPE=$(echo "$REF" | jq -r '.object.type')
          OBJECT_SHA=$(echo "$REF" | jq -r '.object.sha')

          if [ "$OBJECT_TYPE" = "tag" ]; then
            SHA=$(gh api "repos/$REPO/git/tags/$OBJECT_SHA" --jq '.object.sha')
          else
            SHA="$OBJECT_SHA"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved $PLUGIN_NAME @ $TAG → $SHA"

      - name: Update marketplace.json
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_SETTINGS_TOKEN }}
          PLUGIN_NAME: ${{ steps.resolve.outputs.plugin_name }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          # Never silently skip the push: an unset/empty token is a hard error.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DEVELOPER_SETTINGS_TOKEN secret is not set."
            echo "Create a fine-grained PAT with Contents: Read and write on mike-bronner/claude-workbench"
            echo "and add it as DEVELOPER_SETTINGS_TOKEN in this repo's secrets. See docs/ci.md."
            exit 1
          fi

          # Clone UNAUTHENTICATED (issue #252). An embedded credential in the
          # clone URL is written straight into marketplace/.git/config as the
          # origin remote, leaving this long-lived, non-expiring PAT — Contents:
          # write on the SHARED marketplace repo, materially higher-value than a
          # job-scoped GITHUB_TOKEN — readable on disk for the rest of the step.
          # The marketplace is public, so anonymous clone and the retry loop's
          # `git pull --rebase` both work; were it ever made private this fails
          # here, loudly, rather than degrading to a silent skip. The credential
          # is supplied only at push time, via PUSH_URL below — the same posture
          # release.yml uses for its own push.
          git clone --depth 1 \
            "https://github.com/mike-bronner/claude-workbench.git" \
            marketplace
          cd marketplace

          FILE=".claude-plugin/marketplace.json"

          # Shape first, membership second: jq -e exits 1 on "name not found"
          # but 5 on a runtime error (.plugins missing/null/not an array), and
          # `if !` cannot tell them apart — without this guard a malformed
          # upstream marketplace.json would read as a benign "nothing to pin".
          if ! jq -e '.plugins | type == "array"' "$FILE" >/dev/null; then
            echo "::error::$FILE is malformed — .plugins is missing or not an array. Refusing to treat a broken marketplace manifest as 'nothing to pin'."
            exit 1
          fi

          # No matching marketplace entry is a silent no-op (exit 0): the pin
          # only updates an existing row, it never creates one.
          if ! jq -e --arg name "$PLUGIN_NAME" '.plugins | map(.name) | index($name)' "$FILE" >/dev/null; then
            echo "No entry named $PLUGIN_NAME in $FILE — nothing to pin"
            exit 0
          fi

          # Set source.sha for the matching plugin; leave others untouched.
          jq --arg name "$PLUGIN_NAME" --arg sha "$SHA" \
             '.plugins |= map(if .name == $name then .source.sha = $sha else . end)' \
             "$FILE" > "$FILE.tmp"
          mv "$FILE.tmp" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"

          if git diff --cached --quiet; then
            echo "No changes — $PLUGIN_NAME is already pinned to $SHA"
            exit 0
          fi

          git commit -m "chore: pin $PLUGIN_NAME to $TAG ($SHA)"

          # Cross-repo push race (issue #203): the `update-marketplace-sha`
          # concurrency group only serializes runs within THIS repo, but every
          # sibling workbench plugin pins its own entry in the SAME shared
          # marketplace. A sibling's pin commit landing between our clone and
          # our push makes ours non-fast-forward, and an unguarded `git push`
          # would simply fail the release's pin with no recovery. Re-sync onto
          # the new tip and retry, bounded — jq only rewrites this plugin's own
          # entry, so a sibling's edit rebases cleanly. Exhausting the budget
          # is a hard failure, never a silent skip.
          #
          # The credential lives only in this URL, only for the push itself —
          # never in .git/config (issue #252). Pushing by explicit URL means
          # `origin` stays unauthenticated, so the rebase-and-retry path below
          # re-fetches anonymously and no `git` invocation after this step can
          # reach the PAT. HEAD is pushed to the branch the clone checked out
          # (the marketplace's default), read once rather than hardcoded.
          PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/mike-bronner/claude-workbench.git"
          PUSH_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Naming the ref explicitly means naming it correctly: a detached
          # HEAD resolves to the literal "HEAD" and would push refs/heads/HEAD,
          # a junk branch on a repo shared with every other workbench plugin.
          # A plain clone never detaches, so this is a broken assumption —
          # abort rather than write something nobody asked for.
          if [ -z "$PUSH_BRANCH" ] || [ "$PUSH_BRANCH" = "HEAD" ]; then
            echo "::error::Marketplace clone is not on a named branch (detached HEAD) — refusing to push a ref nobody asked for."
            exit 1
          fi

          MAX_PUSH_ATTEMPTS=5
          attempt=1
          while true; do
            if git push "$PUSH_URL" "HEAD:refs/heads/$PUSH_BRANCH"; then
              echo "Pinned $PLUGIN_NAME to $TAG ($SHA)"
              exit 0
            fi
            if [ "$attempt" -ge "$MAX_PUSH_ATTEMPTS" ]; then
              echo "::error::Marketplace push still rejected after $MAX_PUSH_ATTEMPTS attempts — another repo may be pinning continuously. Re-run this workflow to retry."
              exit 1
            fi
            echo "::warning::Marketplace push rejected (attempt $attempt/$MAX_PUSH_ATTEMPTS) — rebasing onto the marketplace tip and retrying"
            sleep "$(( attempt * 5 ))"
            # A conflict means the marketplace moved in a way we cannot replay
            # (history rewrite, or a concurrent edit to our own entry). Abort
            # and fail loudly — never force a pin over someone else's write.
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "::error::Rebase onto the marketplace tip conflicted — refusing to force the pin. Re-run this workflow, or pin $PLUGIN_NAME to $SHA manually."
              exit 1
            fi
            attempt=$(( attempt + 1 ))
          done
