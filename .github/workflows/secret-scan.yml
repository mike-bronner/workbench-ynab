name: secret-scan

# Repo-level secret hygiene (issue #72). This repo handles a YNAB Personal
# Access Token with write access to a live financial budget, so a committed
# credential is high-severity. This workflow fails the build if a credential
# shape lands in the tree, on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ubuntu-only is deliberate (issue #231). bin/secret-scan.sh's rules are grep
  # patterns whose comments claim they hold "on GNU and BSD grep alike", so that
  # claim needs BSD execution somewhere — but a second macOS leg here would spend
  # a 10x-billed runner re-scanning the same tree for the same rules. Instead the
  # BSD half runs where the repo already pays for a macOS runner:
  # tests/secret-scan.test.sh carries the `# bash-3.2-lane:` marker and executes
  # under BSD grep in ci.yml's bash-3-2 job, driving every rule through synthetic
  # fixtures. What stays ubuntu-only is this workflow's scan of the REAL tree — a
  # data check over repo content, not a portability check over grep. See docs/ci.md.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Scan the whole tree for YNAB PAT shapes, cleartext YNAB_ACCESS_TOKEN
      # assignments, and PEM/private-key headers. Exits non-zero on any match.
      - name: Scan for committed secrets
        run: bash bin/secret-scan.sh

      # Prove the scanner actually catches a synthetic, token-shaped string
      # (AC6's negative test) — verified in a throwaway sandbox so no
      # token-shaped string is ever committed to the repo.
      - name: Verify the scanner catches synthetic secrets
        run: bash tests/secret-scan.test.sh

      # Bundle integrity (issue #72): fail the build if the vendored YNAB MCP
      # bundle has drifted from the SHA-256 recorded in vendored.json. This makes
      # the integrity gate automatic rather than relying on a manual run. Offline
      # by design — needs only jq + shasum, both present on the runner.
      - name: Verify vendored bundle integrity
        run: bash vendor/ynab-mcp/verify-bundle.sh
